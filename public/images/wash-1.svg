    <ellipse cx="157.8" cy="26.2" rx="20.3" ry="15.7"/>
    <ellipse cx="184.9" cy="21.6" rx="22.2" ry="15.2"/>
    <ellipse cx="210.7" cy="22.7" rx="24.4" ry="15.5"/>
    <ellipse cx="222" cy="22.9" rx="16" ry="14.4"/>
  </g>
</svg>
